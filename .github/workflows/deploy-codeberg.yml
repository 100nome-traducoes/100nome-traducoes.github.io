name: Deploy Site to Codeberg

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CODEBERG_REPO: ${{ secrets.CODEBERG_REPO }}
      CODEBERG_USERNAME: ${{ secrets.CODEBERG_USERNAME }}
      CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
      CODEBERG_BRANCH: ${{ secrets.CODEBERG_BRANCH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          if [ -z "${CODEBERG_REPO}" ]; then
            echo "Secret em falta: CODEBERG_REPO (formato: owner/repo)."
            exit 1
          fi
          if [ -z "${CODEBERG_USERNAME}" ]; then
            echo "Secret em falta: CODEBERG_USERNAME."
            exit 1
          fi
          if [ -z "${CODEBERG_TOKEN}" ]; then
            echo "Secret em falta: CODEBERG_TOKEN."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build site
        run: npm run build:all

      - name: Prepare publish directory
        run: |
          rm -rf .publish
          mkdir -p .publish
          
          # DEBUG - ver o que existe antes de copiar
          echo "=== A procurar pastas jogo/ e wiki/ ==="
          find . -type d -name "jogo" -o -name "wiki" 2>/dev/null || echo "Pastas não encontradas"
          echo "=== A procurar ficheiros HTML gerados ==="
          find . -name "*.html" | head -20
          
          # Copiar ficheiros da raiz
          cp *.html .publish/ 2>/dev/null || true
          cp *.xml .publish/ 2>/dev/null || true
          cp *.txt .publish/ 2>/dev/null || true
          
          # Copiar assets se existir
          if [ -d "assets" ]; then
            cp -r assets .publish/
            echo "✅ assets copiado"
          fi
          
          # Copiar jogo/ se existir
          if [ -d "jogo" ]; then
            cp -r jogo .publish/
            echo "✅ jogo copiado"
          else
            echo "❌ jogo não encontrado na raiz"
          fi
          
          # Copiar wiki/ se existir
          if [ -d "wiki" ]; then
            cp -r wiki .publish/
            echo "✅ wiki copiado"
          else
            echo "❌ wiki não encontrado na raiz"
          fi
          
          # Copiar data/ se existir (para imagens e assets públicos)
          if [ -d "data" ]; then
            cp -r data .publish/
            echo "✅ data copiado"
            
            # Remover ficheiros fonte privados (se existirem)
            rm -f .publish/data/game-content/jogos.json 2>/dev/null || true
            find .publish/data/wiki-content -type f -name "*.wikimd" -delete 2>/dev/null || true
            echo "✅ Ficheiros fonte privados removidos de data/"
          else
            echo "❌ data não encontrado na raiz"
          fi
          
          echo "=== Conteúdo final de .publish/ ==="
          ls -la .publish/
          if [ -d ".publish/jogo" ]; then
            echo "✅ jogo/ está em .publish/jogo"
            ls -la .publish/jogo/ | head -10
          fi
          if [ -d ".publish/wiki" ]; then
            echo "✅ wiki/ está em .publish/wiki"
            ls -la .publish/wiki/ | head -10
          fi
          if [ -d ".publish/data" ]; then
            echo "✅ data/ está em .publish/data"
            ls -la .publish/data/ | head -10
          fi

      - name: Publish to Codeberg
        run: |
          set -euo pipefail

          TARGET_BRANCH="${CODEBERG_BRANCH:-main}"
          REMOTE_URL="https://${CODEBERG_USERNAME}:${CODEBERG_TOKEN}@codeberg.org/${CODEBERG_REPO}.git"

          rm -rf .codeberg-target
          git clone --depth 1 --branch "${TARGET_BRANCH}" "${REMOTE_URL}" .codeberg-target \
            || (git clone --depth 1 "${REMOTE_URL}" .codeberg-target && cd .codeberg-target && git checkout -b "${TARGET_BRANCH}")

          rsync -a --delete \
            --exclude ".git/" \
            .publish/ .codeberg-target/

          cd .codeberg-target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "Sem alterações para publicar."
            exit 0
          fi

          git add -A
          git commit -m "chore: deploy estático a partir de GitHub Actions"
          git push origin "${TARGET_BRANCH}"
