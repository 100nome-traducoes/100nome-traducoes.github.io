name: Deploy Site to Netlify

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          for secret in NETLIFY_SITE_ID NETLIFY_AUTH_TOKEN; do
            if [ -z "${!secret}" ]; then
              echo "Secret em falta: $secret."
              exit 1
            fi
          done

      - name: Setup Node and cache npm
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build:all

      - name: Prepare publish directory
        run: |
          rm -rf .publish
          mkdir -p .publish
          
          # Copiar ficheiros da raiz
          cp *.html *.xml *.txt .publish/ 2>/dev/null || true
          
          # Copiar pastas
          for dir in assets jogo wiki data; do
            [ -d "$dir" ] && cp -r "$dir" .publish/
          done
          
          # Remover ficheiro de dados sensível
          rm -f .publish/data/game-content/jogos.json 2>/dev/null

      - name: Install Netlify CLI if not cached
        run: |
          if ! command -v netlify >/dev/null 2>&1; then
            npm install -g netlify-cli
          fi

      - name: Deploy to Netlify
        run: |
          netlify deploy \
            --dir=.publish \
            --functions=netlify/functions \
            --prod \
            --site=$NETLIFY_SITE_ID \
            --auth=$NETLIFY_AUTH_TOKEN
