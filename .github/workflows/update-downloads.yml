name: Atualizar Downloads

on:
  workflow_dispatch:

jobs:
  update-downloads:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Update downloads data
        run: node scripts/update-downloads.js
        env:
          DOWNLOADS_API_URL: https://100nome-api.netlify.app/.netlify/functions

      - name: Mostrar diff local
        run: git diff -- data/game-content/downloads.json || true
